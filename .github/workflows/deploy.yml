name: Redline Build & Deploy
on:
  push:
    branches: [main]
    paths:
      - 'build/head.html'
      - 'build/tail.html'
      - 'build/rebuild_app.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: redline-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild app from build/ sources
        run: |
          cd build
          cp ../sw.js ./sw.js
          python rebuild_app.py
          cp ../redline-app/index.html ../index.html
          cp ../redline-app/sw.js ../sw.js
      - name: Commit and push
        run: |
          git config user.name "redline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js parks.txt plazas.txt
          if git diff --staged --quiet; then
            echo "No build changes."
          else
            git commit -m "Auto-build from source $(date -u +%F_%H%M)"
            git push
          fi
